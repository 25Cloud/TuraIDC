name: CI

# 之前只有 workflow_dispatch：CI 实际上从未在推送或 PR 上跑过，
# 代码库里因此累积了 170 多处风格问题，徽章长期停在 2026-08-24 那次失败上。
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# PR 与推送任务默认只读仓库；需要写包权限的发布任务必须单独声明。
permissions:
  contents: read

jobs:
  backend:
    name: Backend (Laravel)
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0@sha256:62fb722c78b24245ddff1796a0fcee4a49cc5b87e0aaaf20c92d1da9e0a2497b
        env:
          MYSQL_DATABASE: finance
          MYSQL_ROOT_PASSWORD: root
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    defaults:
      run:
        working-directory: backend
    env:
      APP_KEY: base64:AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
      DB_CONNECTION: mysql
      DB_HOST: 127.0.0.1
      DB_PORT: 3306
      DB_DATABASE: finance
      DB_USERNAME: root
      DB_PASSWORD: root
    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          # 8.3 是浮动版本：setup-php 每次都取该分支的最新补丁版（当前 ≥ 8.3.36）。
          # 8.3.36 起修复 CVE-2026-109618 / CVE-2026-109619——两个未认证远程代码执行（CVSS 9.2），
          # 可在应用代码执行前触发。不要把版本钉到具体补丁号，避免停在修复前的旧补丁。
          php-version: '8.3'
          extensions: pdo_mysql, mbstring, openssl, redis
          coverage: none
          tools: composer:v2

      - name: Validate composer.json
        run: composer validate --strict --no-check-publish

      - name: Cache Composer dependencies
        uses: actions/cache@v4
        with:
          path: backend/vendor
          key: composer-${{ runner.os }}-${{ hashFiles('backend/composer.lock') }}
          restore-keys: |
            composer-${{ runner.os }}-

      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist --no-progress --no-scripts

      - name: Audit Composer production dependencies
        run: composer audit --locked --no-dev --format=table

      - name: Generate APP key
        run: echo "APP_KEY=base64:$(openssl rand -base64 32)" >> $GITHUB_ENV

      - name: Check code style (Pint)
        run: composer format:check

      - name: Static analysis (PHPStan)
        run: composer analyse

  backend-tests:
    name: Backend tests
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0@sha256:62fb722c78b24245ddff1796a0fcee4a49cc5b87e0aaaf20c92d1da9e0a2497b
        env:
          MYSQL_DATABASE: finance
          MYSQL_ROOT_PASSWORD: root
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
      # redis 扩展装上之后，魔方财务相关用例会真的去连 Redis（JWT 缓存），
      # 本机没装扩展时它们靠「找不到类」的路径侥幸通过，CI 一旦装上就 Connection refused。
      # 与其把扩展去掉掩盖依赖，不如按真实环境起一个 Redis。
      redis:
        image: redis:7-alpine@sha256:c5d34a98396a4775e223c74e929162c35c5a2182901ba26b50ade939941ce14b
        ports:
          - 6379:6379
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    defaults:
      run:
        working-directory: backend
    env:
      APP_ENV: testing
      APP_KEY: base64:AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
      DB_CONNECTION: mysql
      DB_HOST: 127.0.0.1
      DB_PORT: 3306
      DB_DATABASE: idc_test
      DB_USERNAME: root
      DB_PASSWORD: root
      REDIS_HOST: 127.0.0.1
      REDIS_PORT: 6379
    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: pdo_mysql, mbstring, openssl, redis
          coverage: none
          tools: composer:v2

      - name: Cache Composer dependencies
        uses: actions/cache@v4
        with:
          path: backend/vendor
          key: composer-${{ runner.os }}-${{ hashFiles('backend/composer.lock') }}
          restore-keys: |
            composer-${{ runner.os }}-

      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist --no-progress --no-scripts

      # 测试库不是空库跑 migrate：本仓的安装基线是 database/schema/mysql-schema.sql，
      # 迁移只叠加增量（docs/develop/testing.md 第 173 行记的就是这套）。
      # 直接对空库 migrate 会因为早期迁移依赖基线表而失败。
      # 干净 clone 里也没有 storage/ 与 bootstrap/cache（同样被 gitignore，本地是安装时生成的），
      # 缺了它们 Laravel 抛「Please provide a valid cache path.」，路由类用例会整批失败。
      - name: Prepare runtime directories and test database
        working-directory: .
        run: |
          mkdir -p backend/storage/app/public backend/storage/framework/cache/data \
                   backend/storage/framework/sessions backend/storage/framework/views \
                   backend/storage/logs backend/bootstrap/cache
          chmod -R u+rwX,g+rX,o-rwx backend/storage backend/bootstrap/cache
          mysql -h127.0.0.1 -P3306 -uroot -proot \
            -e "CREATE DATABASE IF NOT EXISTS idc_test CHARACTER SET utf8mb4 COLLATE utf8mb4_unicode_ci;"
          mysql -h127.0.0.1 -P3306 -uroot -proot idc_test < backend/database/schema/mysql-schema.sql

      - name: Migrate test database
        run: php artisan migrate --force

      - name: Discover Laravel packages
        run: php artisan package:discover --ansi

      # 路由权限审计：api/v2/admin 每条路由都必须挂 CheckPermission（白名单只放登录与
      # 「管理员本人」自服务端点）。缺权限或未知权限码时命令退出码为 1。
      # 关于插件：命令只审「已注册」路由，CI 干净库里安装的插件与本地不同，注册出来的路由
      # 会变；但插件自带的 admin 路由同样挂在 permission: 分组里（ai_assistant / auto_refund
      # 的 routes/admin.php 都是整段分组），所以安装状态只改变路由条数，不会造成误报。
      # 因此这里不加 `|| true`：一旦红了就是真的有人新加了没挂权限的 admin 路由，必须挡合并。
      - name: Audit admin route permissions
        run: php artisan audit:admin-routes

      # 插件用例（含自助退款、bridge、AI 助手）与单元用例：快、确定、不依赖外网。
      # 注意 PHPUnit 的 --testsuite 只接受一个值（重复传会互相覆盖），所以拆成两步。
      - name: Run plugin tests
        run: php artisan test --testsuite=Plugins

      - name: Run unit tests
        run: php artisan test --testsuite=Unit

      # 全量功能用例：1600+ 条，本地约 8 分钟。跑在同一个测试库上，失败即挡合并。
      - name: Run feature tests
        run: php artisan test --testsuite=Feature

  frontend:
    name: Frontend (Vue 3)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.13.1

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Audit production dependencies
        run: pnpm audit --prod --audit-level=high

      - name: Lint
        run: pnpm run lint:frontends

      - name: Typecheck
        run: pnpm run typecheck:frontends

      - name: Build
        run: pnpm run build:frontends
        env:
          APP_URL: https://api.example.com
          FRONTEND_URL: https://www.example.com
          CLIENT_CONSOLE_URL: https://console.example.com
          ADMIN_URL: https://admin.example.com
          CLIENT_SESSION_COOKIE_DOMAIN: .example.com

  frontend-e2e:
    name: Frontend E2E
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.13.1

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright browsers
        run: pnpm exec playwright install --with-deps chromium webkit

      - name: Run admin E2E
        run: pnpm test:admin-v3

      - name: Run website E2E
        run: pnpm test:e2e:www

      - name: Run console E2E
        run: pnpm test:e2e:console

      - name: Upload Playwright artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-artifacts
          path: |
            frontend-admin-v3/test-results
            frontend-user-v3-www/test-results
            frontend-user-v4-console/test-results
          if-no-files-found: ignore
