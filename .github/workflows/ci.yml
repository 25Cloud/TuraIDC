name: CI

on:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (Laravel)
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_DATABASE: finance
          MYSQL_ROOT_PASSWORD: root
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    defaults:
      run:
        working-directory: backend
    env:
      APP_KEY: base64:AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
      DB_CONNECTION: mysql
      DB_HOST: 127.0.0.1
      DB_PORT: 3306
      DB_DATABASE: finance
      DB_USERNAME: root
      DB_PASSWORD: root
    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: pdo_mysql, mbstring, openssl, redis
          coverage: none
          tools: composer:v2

      - name: Validate composer.json
        run: composer validate --strict --no-check-publish

      - name: Cache Composer dependencies
        uses: actions/cache@v4
        with:
          path: backend/vendor
          key: composer-${{ runner.os }}-${{ hashFiles('backend/composer.lock') }}
          restore-keys: |
            composer-${{ runner.os }}-

      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Generate APP key
        run: echo "APP_KEY=base64:$(openssl rand -base64 32)" >> $GITHUB_ENV

      - name: Check code style (Pint)
        run: composer format:check

      - name: Static analysis (PHPStan)
        run: composer analyse

  frontend:
    name: Frontend (Vue 3)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.13.1

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm run lint:frontends

      - name: Typecheck
        run: pnpm run typecheck:frontends

      - name: Build
        run: pnpm run build:frontends
        env:
          APP_URL: https://api.example.com
          FRONTEND_URL: https://www.example.com
          CLIENT_CONSOLE_URL: https://console.example.com
          ADMIN_URL: https://admin.example.com
          CLIENT_SESSION_COOKIE_DOMAIN: .example.com

      # 浏览器态回归：console 暗色主题守卫 + admin smoke（vite dev server 由
      # playwright webServer 各自拉起，端口 5177/5176 互不冲突）
      - name: Install Playwright browsers
        run: pnpm exec playwright install --with-deps chromium

      - name: E2E (console)
        working-directory: frontend-user-v4-console
        run: pnpm exec playwright test

      - name: E2E (admin smoke)
        working-directory: frontend-admin-v3
        run: pnpm exec playwright test tests/e2e/smoke.spec.ts
