# ============================================================================
# TuraIDC Docker 镜像构建与推送
#
# 触发：
#   - push 任意版本 tag（无条件构建）
#   - 手动触发（workflow_dispatch，无条件构建）
#   - push 到 main / master 且变更涉及核心文件（backend/、前端三端、shared/、
#     deploy/、根构建清单等）；纯文档类变更（docs/、docs-web/、*.md 等）不构建
#
# 产物（推送到 GHCR，镜像名全部小写）：
#   ghcr.io/<owner>/turaidc-app         后端（PHP-FPM + Nginx + Cron + VNC Relay）
#   ghcr.io/<owner>/turaidc-frontends   前端三端合一（www:8081 / console:8082 / admin:8083）
#
# 前置配置（Settings → Secrets and variables → Actions）：
#   前端构建需要四个公开地址（build args），推荐配在 Variables（明文，非敏感）：
#   APP_URL / FRONTEND_URL / CLIENT_CONSOLE_URL / ADMIN_URL
#   （CLIENT_SESSION_COOKIE_DOMAIN 跨子域共享登录态时再配，未配置则传空）
#   未配 Variables 时回落读取同名 Secrets；两者都没配则前端构建失败，以提示你补全。
#   注意：不想用 CI 也可本地构建——deploy/docker/.env 直接提供这些值，
#   运行 docker compose up -d --build 即可，GitHub 侧无需任何配置。
# ============================================================================
name: Docker Image Build & Push

on:
  push:
    branches: [main, master]
    tags: ["*"]
  workflow_dispatch:

concurrency:
  group: docker-image-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io

jobs:
  changes:
    name: 判断是否需要构建
    runs-on: ubuntu-latest
    outputs:
      should_build: ${{ steps.decide.outputs.should_build }}
    steps:
      - uses: actions/checkout@v4
        with:
          # 需要完整历史才能对 before..after 做文件级 diff
          fetch-depth: 0

      - name: 判断是否需要构建
        id: decide
        env:
          EVENT_NAME: ${{ github.event_name }}
          GIT_REF: ${{ github.ref }}
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.sha }}
        run: |
          # tag 推送与手动触发：无条件构建
          if [[ "$EVENT_NAME" == "workflow_dispatch" || "$GIT_REF" == refs/tags/* ]]; then
            echo "should_build=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # 新分支/异常事件拿不到基线提交时，保守起见执行构建
          if [[ ! "$BEFORE" =~ ^[0-9a-f]{40}$ ]]; then
            echo "should_build=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # 强推等场景 before 可能不在当前历史中，diff 失败则视为需要构建
          CHANGED="$(git diff --name-only "$BEFORE" "$AFTER" || echo backend/)"
          echo "本次变更文件："
          echo "$CHANGED"

          # 核心文件：后端、前端三端、共享层、部署与镜像定义、根构建清单、本工作流
          CORE_PATTERN='^(backend/|frontend-admin-v3/|frontend-user-v3-www/|frontend-user-v4-console/|shared/|deploy/|docker-compose.*\.ya?ml$|Dockerfile$|package\.json$|pnpm-lock\.yaml$|pnpm-workspace\.yaml$|tsconfig\.base\.json$|\.github/workflows/docker-image\.yml$)'

          if echo "$CHANGED" | grep -Eq "$CORE_PATTERN"; then
            echo "检测到核心文件变更，执行镜像构建"
            echo "should_build=true" >> "$GITHUB_OUTPUT"
          else
            echo "仅文档等非核心文件变更，跳过镜像构建"
            echo "should_build=false" >> "$GITHUB_OUTPUT"
          fi

  backend:
    name: Build & push turaidc-app
    needs: changes
    if: needs.changes.outputs.should_build == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      # GHCR 镜像名必须全小写
      - name: Set image namespace (lowercase)
        run: echo "IMAGE_NAMESPACE=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_ENV"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags/labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAMESPACE }}/turaidc-app
          # latest 只在打 tag（正式发布）时打，分支推送只打分支名 + sha
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/') }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/docker/backend/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Job summary
        run: |
          echo "## 后端镜像已推送" >> "$GITHUB_STEP_SUMMARY"
          echo "- ${{ env.REGISTRY }}/${{ env.IMAGE_NAMESPACE }}/turaidc-app" >> "$GITHUB_STEP_SUMMARY"
          echo "- Tags: ${{ steps.meta.outputs.tags }}" >> "$GITHUB_STEP_SUMMARY"

  frontends:
    name: Build & push turaidc-frontends
    needs: changes
    if: needs.changes.outputs.should_build == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Set image namespace (lowercase)
        run: echo "IMAGE_NAMESPACE=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_ENV"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags/labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAMESPACE }}/turaidc-frontends
          # latest 只在打 tag（正式发布）时打，分支推送只打分支名 + sha
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/') }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/docker/frontends/Dockerfile
          build-args: |
            APP_URL=${{ vars.APP_URL || secrets.APP_URL }}
            FRONTEND_URL=${{ vars.FRONTEND_URL || secrets.FRONTEND_URL }}
            CLIENT_CONSOLE_URL=${{ vars.CLIENT_CONSOLE_URL || secrets.CLIENT_CONSOLE_URL }}
            ADMIN_URL=${{ vars.ADMIN_URL || secrets.ADMIN_URL }}
            CLIENT_SESSION_COOKIE_DOMAIN=${{ vars.CLIENT_SESSION_COOKIE_DOMAIN || secrets.CLIENT_SESSION_COOKIE_DOMAIN }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Job summary
        run: |
          echo "## 前端镜像已推送（三端合一）" >> "$GITHUB_STEP_SUMMARY"
          echo "- ${{ env.REGISTRY }}/${{ env.IMAGE_NAMESPACE }}/turaidc-frontends" >> "$GITHUB_STEP_SUMMARY"
          echo "- Tags: ${{ steps.meta.outputs.tags }}" >> "$GITHUB_STEP_SUMMARY"
