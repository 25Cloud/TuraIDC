  <!-- API 源站预连接：首屏数据请求与 hero 视频均指向该跨域源，提前 DNS + TLS -->
  <link rel="preconnect" href="%VITE_API_BASE_URL%" crossorigin />
  <link rel="prefetch" href="%VITE_API_BASE_URL%/v2/site/config" as="fetch" crossorigin="anonymous" />

  <!-- 首页 LCP 关键路径预热：在 JS 下载前提前发起 /v2/site/home，home 页消费 window.__HOME_FETCH__ 复用响应，砍掉 1 个串行 RTT -->
  <script>
    (function () {
      var base = '%VITE_API_BASE_URL%'
      if (!base || typeof window === 'undefined' || !window.fetch) return
      // 仅根路径（首页）预热；seo 落地页/products 等页面不消费该响应，避免浪费
      if (window.location.pathname !== '/' && window.location.pathname !== '') return
      var url = base.replace(/\/+$/, '') + '/v2/site/home'
      window.__HOME_FETCH__ = window.fetch(url, { credentials: 'omit' })
        .then(function (res) {
          if (!res.ok) throw new Error('home prefetch: ' + res.status)
          return res.json()
        })
        .catch(function () {
          // 预热失败静默降级，home 页回退 axios 常规请求
          window.__HOME_FETCH__ = undefined
        })
    })()
  </script>
  
  <!-- 关键第三方域名预连接，减少 DNS + TLS 握手开销 -->
  <link rel="preconnect" href="//api.geetest.com" crossorigin />
  <link rel="dns-prefetch" href="//static.geetest.com" />
  <link rel="dns-prefetch" href="//gcaptcha4.geetest.com" />
  <link rel="dns-prefetch" href="//qr.alipay.com" />
  <link rel="dns-prefetch" href="//mclient.alipay.com" />
</head>
<body>
  <div id="app">
    <!-- 初始加载动画：JS 解析完成前展示，Vue 挂载后自动替换 -->
    <div id="app-splash" aria-label="页面加载中">
      <style>
        #app-splash {
          position: fixed;
          inset: 0;
          display: flex;
          flex-direction: column;
          align-items: center;
          justify-content: center;
          gap: 28px;
          background: linear-gradient(168deg, #f8fafc 0%, #f0f4ff 100%);
          z-index: 9999;
          opacity: 1;
          transition: opacity 0.3s ease-out;
        }
        #app-splash.fade-out {
          opacity: 0;
          pointer-events: none;
        }
        #app-splash .splash-logo {
          width: 48px;
          height: 48px;
          animation: splash-breathe 2s ease-in-out infinite;
        }
        #app-splash .splash-bar-track {
          width: 180px;
          height: 3px;
          border-radius: 999px;
          background: rgba(22, 93, 255, 0.1);
          overflow: hidden;
        }
        #app-splash .splash-bar-fill {
          width: 40%;
          height: 100%;
          border-radius: 999px;
          background: linear-gradient(90deg, #165dff, #4d8eff);
          animation: splash-slide 1.2s cubic-bezier(0.22, 1, 0.36, 1) infinite;
        }
        @keyframes splash-breathe {
          0%, 100% { transform: scale(1); opacity: 0.92; }
          50% { transform: scale(1.04); opacity: 1; }
        }
        @keyframes splash-slide {
          0% { transform: translateX(-120%); }
          100% { transform: translateX(350%); }
        }
      </style>
      <img class="splash-logo" src="/branding/splash-96.png" alt="图拉云" width="48" height="48" />
      <div class="splash-bar-track"><div class="splash-bar-fill"></div></div>
    </div>
  </div>
  <script type="module" src="/src/main.js"></script>
</body>
</html>
