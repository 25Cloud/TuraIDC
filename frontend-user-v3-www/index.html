<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="format-detection" content="telephone=no,email=no,address=no" />
  <meta name="theme-color" content="#165dff" />
  <meta name="description" content="稳定、安全、高性价比的云服务器与 IDC 服务平台，覆盖香港、美国与国内多地节点，提供云服务器、独立服务器、云电脑与工单支持。" />
  <meta name="keywords" content="云服务器,独立服务器,高防服务器,云电脑,香港服务器,美国服务器,BGP 多线,IDC 服务" />
  <meta name="msvalidate.01" content="EA1D7C1A527755CFEACE1520F36EC05F" />
  <meta name="referrer" content="strict-origin-when-cross-origin" />
  <!-- 裸壳默认 noindex：SEO 动态渲染会剥掉本行并注入按页面配置的 robots；
       只有未被后端渲染的路径（购买长路径、未知路径）保留 noindex，避免软 404 被收录 -->
  <meta name="robots" content="noindex, nofollow" />
  <meta property="og:type" content="website" />
  <meta property="og:title" content="稳定、安全、高性价比的云服务器与 IDC 服务平台" />
  <meta property="og:description" content="提供云服务器、独立服务器、云电脑与 IDC 服务，覆盖香港、美国与国内多地节点。" />
  <meta name="twitter:card" content="summary_large_image" />
  <!-- canonical 不在静态 HTML 里声明：href="/" 会被 vite 8 当资源解析并触发 EISDIR，
       且 canonical 必须随路径变化，统一由后端 SEO 动态渲染注入 -->
  <title>云服务器与 IDC 服务平台</title>
  <!-- 首访不预置默认品牌图标：中性占位，缓存脚本或站点配置接口返回后再替换 -->
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3C/svg%3E" />
  <!-- vite 8 会把 html 内非外部 URL 当资源解析，href="/" 指向根目录会触发 EISDIR，故移除该 alternate 行 -->
  <!-- API 源站预连接：首屏数据请求与 hero 视频均指向该跨域源，提前 DNS + TLS -->
  <link rel="preconnect" href="%VITE_API_BASE_URL%" crossorigin />
  <!-- 不再用 <link rel=prefetch> 预取 /v2/site/config：bootstrap 挂载后会自己 fetch，
       两者叠加会让每次进入都发 2-3 次同样的 config 请求 -->

  <!-- 首页 LCP 关键路径预热：在 JS 下载前提前发起 /v2/site/home，home 页消费 window.__HOME_FETCH__ 复用响应，砍掉 1 个串行 RTT -->
  <script>
    (function () {
      var base = '%VITE_API_BASE_URL%'
      if (!base || typeof window === 'undefined' || !window.fetch) return
      // 仅根路径（首页）预热；seo 落地页/products 等页面不消费该响应，避免浪费
      if (window.location.pathname !== '/' && window.location.pathname !== '') return
      var url = base.replace(/\/+$/, '') + '/v2/site/home'
      window.__HOME_FETCH__ = window.fetch(url, { credentials: 'omit' })
        .then(function (res) {
          if (!res.ok) throw new Error('home prefetch: ' + res.status)
          return res.json()
        })
        .catch(function () {
          // 预热失败静默降级，home 页回退 axios 常规请求
          window.__HOME_FETCH__ = undefined
        })
    })()
  </script>
  
  <!-- 关键第三方域名预连接，减少 DNS + TLS 握手开销 -->
  <link rel="preconnect" href="//api.geetest.com" crossorigin />
  <link rel="dns-prefetch" href="//static.geetest.com" />
  <link rel="dns-prefetch" href="//gcaptcha4.geetest.com" />
  <link rel="dns-prefetch" href="//qr.alipay.com" />
  <link rel="dns-prefetch" href="//mclient.alipay.com" />

  <!-- 站点配置首帧注入：Vue 挂载、接口返回之前，用上一次访问缓存的站点名 / favicon
       覆盖构建期写死的默认品牌，自建站首屏不会闪出默认品牌。缓存由
       shared/runtime/branding.ts 写入，键名与字段需保持一致。 -->
  <script>
    (function () {
      try {
        var raw = window.localStorage.getItem('turaidc:site-config')
        if (!raw) return
        var config = JSON.parse(raw)
        if (!config || typeof config !== 'object' || Array.isArray(config)) return

        var siteName = String(config.site_name || '').trim().slice(0, 40)
        var browserTitle = String(config.browser_title || '').trim().slice(0, 40)
        // 资源地址不按站点名的短上限截断，否则长路径 + 签名参数会被截坏
        var favicon = String(config.site_favicon || '').trim()

        // 页面标题没有品牌名前缀，这里直接整体替换；SEO 动态渲染与路由守卫
        // 会在其后用完整的站点配置再次覆写，这里只负责首帧不闪默认品牌。
        var baseTitle = browserTitle || siteName
        if (baseTitle) document.title = baseTitle

        if (favicon) {
          var icons = document.querySelectorAll('link[rel*="icon"]')
          for (var i = 0; i < icons.length; i++) {
            icons[i].href = favicon
          }
        }
      } catch (error) {
        /* localStorage 被禁用、缓存损坏或 JSON 非法时保持默认，不影响加载 */
      }
    })()
  </script>
</head>
<body>
  <div id="app"></div>
  <!-- 初始加载骨架：JS 解析完成前展示，与首页真实结构同形（顶栏 + 标题 + 卡片格）。
       Vue 首次路由渲染完成后再淡出，页面内骨架与这里同形，切换不白闪、不跳高。
       颜色与节奏必须与 src/components/common/skeleton.scss 保持一致（1.2s 扫光）。 -->
  <div id="app-splash" role="status" aria-live="polite" aria-label="页面加载中">
    <style>
      #app-splash {
        position: fixed;
        inset: 0;
        z-index: 9999;
        background: #f5f7fb;
        opacity: 1;
        transition: opacity 0.3s ease-out;
        overflow: hidden;
      }
      /* 内联骨架先于全局样式加载：自己补 box-sizing，否则 padding 会把
         460px 主舞台撑成 524px，和真实 Hero 高度对不上（淡出瞬间跳 64px） */
      #app-splash,
      #app-splash *,
      #app-splash *::before,
      #app-splash *::after {
        box-sizing: border-box;
      }
      #app-splash.fade-out {
        opacity: 0;
        pointer-events: none;
      }
      #app-splash .sk-container {
        width: min(1200px, calc(100% - 48px));
        margin: 0 auto;
      }
      #app-splash .sk {
        position: relative;
        display: block;
        overflow: hidden;
        border-radius: 6px;
        background-color: #e1e8f2;
      }
      /* 与 src/components/common/skeleton.scss 同一套扫光：1.2s 白色高光从左到右 */
      #app-splash .sk::after {
        content: '';
        position: absolute;
        inset: 0;
        transform: translateX(-100%);
        background: linear-gradient(
          90deg,
          rgba(255, 255, 255, 0) 0%,
          rgba(255, 255, 255, 0.55) 50%,
          rgba(255, 255, 255, 0) 100%
        );
        animation: splash-skeleton-sweep 1.2s ease-in-out infinite;
      }
      /* 顶栏：与真实 header 同高同布局 */
      #app-splash .sk-topbar {
        height: 64px;
        background: #ffffff;
        border-bottom: 1px solid #eef2f7;
      }
      #app-splash .sk-topbar .sk-container {
        display: flex;
        align-items: center;
        height: 64px;
      }
      #app-splash .sk-logo {
        width: 148px;
        height: 32px;
        flex: none;
      }
      #app-splash .sk-nav {
        display: flex;
        align-items: center;
        gap: 32px;
        margin-left: 40px;
      }
      #app-splash .sk-nav .sk {
        height: 14px;
        border-radius: 999px;
      }
      #app-splash .sk-actions {
        display: flex;
        align-items: center;
        gap: 12px;
        margin-left: auto;
      }
      #app-splash .sk-actions .sk {
        height: 34px;
        width: 72px;
        border-radius: 3px;
      }
      #app-splash .sk-actions .sk:last-child {
        width: 96px;
      }
      /* Hero：与 HomeHeroCarousel 的首屏结构一致 */
      #app-splash .sk-hero {
        padding: 28px 0 44px;
        background: linear-gradient(135deg, #f8fbff 0%, #eef4ff 52%, #ffffff 100%);
      }
      #app-splash .sk-stage {
        display: grid;
        grid-template-columns: 220px minmax(0, 1fr) minmax(340px, 420px);
        column-gap: clamp(28px, 3.2vw, 48px);
        row-gap: 20px;
        align-items: center;
        min-height: 460px;
        padding: 40px 0 24px;
      }
      #app-splash .sk-rail {
        display: flex;
        flex-direction: column;
        gap: 8px;
        padding-top: 18px;
      }
      #app-splash .sk-rail .sk {
        height: 52px;
      }
      #app-splash .sk-hero-copy {
        display: flex;
        flex-direction: column;
        gap: 12px;
      }
      #app-splash .sk-hero-title {
        width: min(520px, 92%);
        height: 46px;
      }
      #app-splash .sk-hero-desc {
        width: min(620px, 100%);
        height: 16px;
        border-radius: 999px;
      }
      #app-splash .sk-hero-desc.short {
        width: min(460px, 78%);
      }
      #app-splash .sk-hero-actions {
        display: flex;
        gap: 12px;
        margin-top: 14px;
      }
      #app-splash .sk-hero-actions .sk {
        height: 48px;
        border-radius: 999px;
      }
      #app-splash .sk-hero-actions .sk:first-child {
        width: 160px;
      }
      #app-splash .sk-hero-actions .sk:last-child {
        width: 132px;
      }
      #app-splash .sk-features {
        display: grid;
        grid-template-columns: repeat(5, minmax(0, 1fr));
        gap: 1px;
        margin-top: 32px;
        background: #ffffff;
        border: 1px solid #e5eaf3;
        border-radius: 6px;
        box-shadow: 0 2px 10px rgba(15, 23, 42, 0.06);
        overflow: hidden;
      }
      #app-splash .sk-features .sk {
        height: 116px;
        border-radius: 0;
      }
      /* 产品区块：白底标题 + 分类 + 四张卡 */
      #app-splash .sk-products {
        padding: 72px 0 80px;
        background: #ffffff;
      }
      #app-splash .sk-heading {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 12px;
      }
      #app-splash .sk-heading .sk:first-child {
        width: min(360px, 60%);
        height: 30px;
        border-radius: 999px;
      }
      #app-splash .sk-heading .sk:last-child {
        width: min(560px, 84%);
        height: 14px;
        border-radius: 999px;
      }
      #app-splash .sk-tabs {
        display: flex;
        justify-content: center;
        gap: 12px;
        margin: 34px 0 28px;
      }
      #app-splash .sk-tabs .sk {
        height: 34px;
        border-radius: 999px;
      }
      #app-splash .sk-cards {
        display: grid;
        grid-template-columns: repeat(4, minmax(0, 1fr));
        gap: 16px;
      }
      #app-splash .sk-card {
        display: flex;
        flex-direction: column;
        gap: 10px;
        min-height: 100px;
        padding: 14px 20px 12px;
        border: 1px solid #e5eaf3;
        border-radius: 6px;
        background: #ffffff;
      }
      #app-splash .sk-card .sk {
        height: 12px;
        border-radius: 999px;
      }
      #app-splash .sk-card .sk:first-child {
        width: 62%;
        height: 18px;
      }
      #app-splash .sk-card .sk:nth-child(2) {
        width: 100%;
      }
      #app-splash .sk-card .sk:last-child {
        width: 88px;
        margin-top: auto;
        margin-left: auto;
      }
      @keyframes splash-skeleton-sweep {
        0% {
          transform: translateX(-100%);
        }
        100% {
          transform: translateX(100%);
        }
      }
      @media (prefers-reduced-motion: reduce) {
        #app-splash {
          transition: none;
        }
        #app-splash .sk::after {
          animation: none;
          display: none;
        }
      }
      @media (max-width: 1180px) {
        #app-splash .sk-stage {
          grid-template-columns: 220px minmax(0, 1fr);
          min-height: 0;
          padding: 28px 0 16px;
          align-items: start;
        }
        #app-splash .sk-features {
          grid-template-columns: repeat(3, minmax(0, 1fr));
          margin-top: 24px;
        }
        #app-splash .sk-cards {
          grid-template-columns: repeat(2, minmax(0, 1fr));
        }
      }
      @media (max-width: 960px) {
        #app-splash .sk-nav,
        #app-splash .sk-actions {
          display: none;
        }
        #app-splash .sk-hero {
          padding: 20px 0 28px;
        }
        #app-splash .sk-stage {
          grid-template-columns: 1fr;
          gap: 18px;
          padding: 12px 0 4px;
        }
        #app-splash .sk-rail {
          flex-direction: row;
          padding: 0 0 4px;
          overflow: hidden;
        }
        #app-splash .sk-rail .sk {
          flex: 0 0 auto;
          width: 96px;
          height: 32px;
          border-radius: 999px;
        }
        #app-splash .sk-features {
          grid-template-columns: repeat(2, minmax(0, 1fr));
          margin-top: 22px;
        }
      }
      @media (max-width: 640px) {
        #app-splash .sk-container {
          width: calc(100% - 24px);
        }
        #app-splash .sk-hero {
          padding: 16px 0 24px;
        }
        #app-splash .sk-rail {
          display: none;
        }
        #app-splash .sk-hero-title {
          height: 32px;
        }
        #app-splash .sk-features {
          grid-template-columns: 1fr;
          margin-top: 18px;
        }
        #app-splash .sk-features .sk {
          height: 108px;
        }
        #app-splash .sk-products {
          padding: 48px 0 56px;
        }
        #app-splash .sk-cards {
          grid-template-columns: 1fr;
        }
      }
    </style>
    <div class="sk-topbar" aria-hidden="true">
      <div class="sk-container">
        <span class="sk sk-logo"></span>
        <div class="sk-nav">
          <span class="sk" style="width: 44px"></span>
          <span class="sk" style="width: 52px"></span>
          <span class="sk" style="width: 80px"></span>
          <span class="sk" style="width: 52px"></span>
          <span class="sk" style="width: 72px"></span>
        </div>
        <div class="sk-actions">
          <span class="sk"></span>
          <span class="sk"></span>
        </div>
      </div>
    </div>
    <div class="sk-hero" aria-hidden="true">
      <div class="sk-container">
        <div class="sk-stage">
          <div class="sk-rail">
            <span class="sk"></span>
            <span class="sk"></span>
            <span class="sk"></span>
            <span class="sk"></span>
            <span class="sk"></span>
          </div>
          <div class="sk-hero-copy">
            <span class="sk sk-hero-title"></span>
            <span class="sk sk-hero-desc"></span>
            <span class="sk sk-hero-desc short"></span>
            <div class="sk-hero-actions">
              <span class="sk"></span>
              <span class="sk"></span>
            </div>
          </div>
        </div>
        <div class="sk-features">
          <span class="sk"></span>
          <span class="sk"></span>
          <span class="sk"></span>
          <span class="sk"></span>
          <span class="sk"></span>
        </div>
      </div>
    </div>
    <div class="sk-products" aria-hidden="true">
      <div class="sk-container">
        <div class="sk-heading">
          <span class="sk"></span>
          <span class="sk"></span>
        </div>
        <div class="sk-tabs">
          <span class="sk" style="width: 88px"></span>
          <span class="sk" style="width: 104px"></span>
          <span class="sk" style="width: 96px"></span>
          <span class="sk" style="width: 118px"></span>
          <span class="sk" style="width: 90px"></span>
        </div>
        <div class="sk-cards">
          <div class="sk-card"><span class="sk"></span><span class="sk"></span><span class="sk"></span></div>
          <div class="sk-card"><span class="sk"></span><span class="sk"></span><span class="sk"></span></div>
          <div class="sk-card"><span class="sk"></span><span class="sk"></span><span class="sk"></span></div>
          <div class="sk-card"><span class="sk"></span><span class="sk"></span><span class="sk"></span></div>
        </div>
      </div>
    </div>
  </div>
  <script type="module" src="/src/main.js"></script>
</body>
</html>
