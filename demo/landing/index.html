<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>TuraIDC 演示环境</title>
    <meta name="robots" content="noindex" />
    <style>
      :root {
        color-scheme: dark;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 48px 24px;
        background:
          radial-gradient(1200px 600px at 15% -10%, rgba(56, 189, 248, 0.18), transparent 60%),
          radial-gradient(900px 500px at 90% 110%, rgba(129, 140, 248, 0.16), transparent 60%), #0b1220;
        color: #e2e8f0;
        font-family:
          'Inter', 'PingFang SC', 'Microsoft YaHei', system-ui, -apple-system, 'Segoe UI', sans-serif;
      }

      main {
        width: min(960px, 100%);
      }

      h1 {
        margin: 0 0 12px;
        font-size: clamp(28px, 4vw, 40px);
        letter-spacing: -0.02em;
      }

      p.lead {
        margin: 0 0 36px;
        color: #94a3b8;
        line-height: 1.7;
        max-width: 62ch;
      }

      ul {
        display: grid;
        gap: 16px;
        grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
        margin: 0;
        padding: 0;
        list-style: none;
      }

      a.card {
        display: block;
        height: 100%;
        padding: 22px 24px;
        border-radius: 16px;
        border: 1px solid rgba(148, 163, 184, 0.18);
        background: rgba(15, 23, 42, 0.6);
        color: inherit;
        text-decoration: none;
        transition:
          transform 0.16s ease,
          border-color 0.16s ease,
          background 0.16s ease;
      }

      a.card:hover,
      a.card:focus-visible {
        transform: translateY(-2px);
        border-color: rgba(56, 189, 248, 0.55);
        background: rgba(15, 23, 42, 0.85);
        outline: none;
      }

      .card h2 {
        margin: 0 0 8px;
        font-size: 18px;
      }

      .card span {
        color: #94a3b8;
        font-size: 14px;
        line-height: 1.6;
      }

      footer {
        margin-top: 40px;
        font-size: 13px;
        color: #64748b;
        line-height: 1.8;
      }

      footer a {
        color: #38bdf8;
        text-decoration: none;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>TuraIDC 演示环境</h1>
      <p class="lead">
        三个界面都是真实构建产物，数据为示例数据，所有请求在浏览器内本地应答，不会触达任何后端。可以随便点，不会产生任何真实操作。
      </p>

      <ul>
        <li>
          <a class="card" href="/user/">
            <h2>用户端</h2>
            <span>商品浏览、配置选购、下单与账户中心</span>
          </a>
        </li>
        <li>
          <a class="card" href="/console/">
            <h2>用户控制台</h2>
            <span>实例概览、开关机、快照与 ISO、账单与工单</span>
          </a>
        </li>
        <li>
          <a class="card" href="/admin/">
            <h2>管理端</h2>
            <span>经营看板、商品与订单、用户、财务、系统设置</span>
          </a>
        </li>
        <li>
          <a class="card" href="https://www.turaidc.com/">
            <h2>项目官网</h2>
            <span>功能、部署方式与开源仓库</span>
          </a>
        </li>
      </ul>

      <footer>
        演示环境固定使用示例数据，操作不会生效；要完整体验请
        <a href="https://github.com/25Cloud/TuraIDC">自建实例</a>。
      </footer>
    </main>
  </body>
</html>
