; TuraIDC 后端容器进程托管（Supervisor）
; php-fpm / nginx / cron / vnc:relay 统一由 Supervisor 管理，日志走容器 stdout/stderr
; 主配置 /etc/supervisor/supervisord.conf 已含 [supervisord]，前台运行由 entrypoint 的 -n 参数保证

[program:php-fpm]
command = /usr/local/sbin/php-fpm -F
autostart = true
autorestart = true
stopasgroup = true
killasgroup = true
stdout_logfile = /dev/stdout
stdout_logfile_maxbytes = 0
stderr_logfile = /dev/stderr
stderr_logfile_maxbytes = 0

[program:nginx]
command = /usr/sbin/nginx -g "daemon off;"
autostart = true
autorestart = true
stopasgroup = true
killasgroup = true
stdout_logfile = /dev/stdout
stdout_logfile_maxbytes = 0
stderr_logfile = /dev/stderr
stderr_logfile_maxbytes = 0

; crond 以 root 启动；实际每分钟的 schedule:run 由 www-data 的 crontab 执行
[program:cron]
command = /usr/sbin/cron -f
autostart = true
autorestart = true
stopasgroup = true
killasgroup = true
stdout_logfile = /dev/stdout
stdout_logfile_maxbytes = 0
stderr_logfile = /dev/stderr
stderr_logfile_maxbytes = 0

; VNC WebSocket 中继，监听 127.0.0.1:8100，由容器内 nginx 转发 /ws/vnc
[program:vnc-relay]
command = /usr/local/bin/php /var/www/backend/artisan vnc:relay
directory = /var/www/backend
user = www-data
autostart = true
autorestart = true
stopasgroup = true
killasgroup = true
stdout_logfile = /dev/stdout
stdout_logfile_maxbytes = 0
stderr_logfile = /dev/stderr
stderr_logfile_maxbytes = 0
