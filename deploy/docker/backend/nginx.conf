# TuraIDC 后端 API 站点 Nginx 配置（容器内 :80）
# 生产 HTTPS 由 1Panel / 宿主机 Nginx / Cloudflare 等反代终止，本配置保持 HTTP。
# 反代会带 X-Forwarded-Proto: https，下面 map 把它转成 PHP 能识别的 HTTPS=on，
# 等效宝塔的 fastcgi_param HTTPS on，让 Laravel 的 isSecure() 正确返回 true。

map $http_x_forwarded_proto $turaidc_https_flag {
    default "";
    https  on;
}

server {
    listen 80;
    server_name _;

    root /var/www/backend/public;
    index index.php;
    charset utf-8;

    # 上传大小（与 php.ini 的 upload_max_filesize/post_max_size 配套）
    client_max_body_size 100m;

    # 压缩：与 frontends 容器保持一致的口径。API 以 JSON 为主，列表类响应体积可观，
    # 不能依赖“宿主机反代会压缩”——Nginx 默认 gzip off，运维未显式开启时 API 全程不压缩。
    # 已压缩的响应带 Content-Encoding，不会被二次压缩。
    gzip              on;
    gzip_vary         on;
    gzip_min_length   1024;
    gzip_comp_level   5;
    gzip_types        text/plain text/css application/javascript application/json
                      application/xml image/svg+xml;

    # ---- VNC WebSocket 中继：转发到同容器内的 vnc:relay ----
    location ^~ /ws/vnc {
        proxy_pass http://127.0.0.1:8100;
        proxy_http_version 1.1;
        proxy_set_header Upgrade          $http_upgrade;
        proxy_set_header Connection       "upgrade";
        proxy_set_header Host             $host;
        proxy_set_header X-Real-IP        $remote_addr;
        proxy_set_header X-Forwarded-For  $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # ---- PHP-FPM ----
    location ~ ^/index\.php(/|$) {
        fastcgi_pass 127.0.0.1:9000;
        fastcgi_split_path_info ^(.+\.php)(/.*)$;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME  $document_root$fastcgi_script_name;
        fastcgi_param PATH_INFO        $fastcgi_path_info;
        fastcgi_param HTTP_PROXY       "";
        # 反代 HTTPS 终止时把 HTTPS=on 传给 PHP，让 Laravel 识别为安全连接
        fastcgi_param HTTPS            $turaidc_https_flag if_not_empty;
        fastcgi_read_timeout 300s;
        fastcgi_index index.php;
    }

    # ---- Laravel 回退 ----
    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # 不记录 favicon/robots 等静态 404
    location = /favicon.ico { access_log off; log_not_found off; }
    location = /robots.txt  { access_log off; log_not_found off; }

    location ~ /\.(?!well-known).* {
        deny all;
    }
}
