# TuraIDC 后端 API 站点 Nginx 配置（容器内 :80）
# 生产 HTTPS 由 1Panel / 宿主机 Nginx / Cloudflare 等反代终止，本配置保持 HTTP。

server {
    listen 80;
    server_name _;

    root /var/www/backend/public;
    index index.php;
    charset utf-8;

    # 上传大小（与 php.ini 的 upload_max_filesize/post_max_size 配套）
    client_max_body_size 100m;

    # ---- VNC WebSocket 中继：转发到同容器内的 vnc:relay ----
    location ^~ /ws/vnc {
        proxy_pass http://127.0.0.1:8100;
        proxy_http_version 1.1;
        proxy_set_header Upgrade          $http_upgrade;
        proxy_set_header Connection       "upgrade";
        proxy_set_header Host             $host;
        proxy_set_header X-Real-IP        $remote_addr;
        proxy_set_header X-Forwarded-For  $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # ---- PHP-FPM ----
    location ~ ^/index\.php(/|$) {
        fastcgi_pass 127.0.0.1:9000;
        fastcgi_split_path_info ^(.+\.php)(/.*)$;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME  $document_root$fastcgi_script_name;
        fastcgi_param PATH_INFO        $fastcgi_path_info;
        fastcgi_param HTTP_PROXY       "";
        fastcgi_read_timeout 300s;
        fastcgi_index index.php;
    }

    # ---- Laravel 回退 ----
    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # 不记录 favicon/robots 等静态 404
    location = /favicon.ico { access_log off; log_not_found off; }
    location = /robots.txt  { access_log off; log_not_found off; }

    location ~ /\.(?!well-known).* {
        deny all;
    }
}
