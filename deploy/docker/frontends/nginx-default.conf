# TuraIDC 前端三端合一 Nginx 配置（容器内三端口）
# 8081 → 官网/用户入口  8082 → 用户控制台  8083 → 管理端
# Vue Router History 模式回退 + 静态资源长缓存

# ---------- 官网/用户入口 ----------
server {
    listen 8081;
    server_name _;

    # 禁用绝对重定向：避免尾斜杠规范化时泄露容器内部端口并降级协议
    absolute_redirect off;

    root /usr/share/nginx/html/www;
    index index.html;
    charset utf-8;

    gzip on;
    # 构建产物已随包生成 .gz 预压缩文件（www 下 65 个），镜像 nginx 含
    # http_gzip_static_module，优先直接返回预压缩件，避免每次请求重复压缩。
    # 注：同时生成的 .br 需要 brotli 模块，当前 nginx:alpine 基础镜像不含，故未启用。
    gzip_static on;
    gzip_min_length 1024;
    gzip_types text/css application/javascript application/json image/svg+xml application/xml;
    gzip_vary on;

    # 带 hash 的构建产物：长缓存
    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # ============ 官网 SEO 动态渲染 ============
    # 公开页面交由后端 Laravel 渲染完整 HTML（meta/正文来自数据库），
    # 解决 SPA 空壳导致搜索引擎采集不到内容的问题。内部转发无循环：
    # 后端渲染时直接抓取本静态服务的 index.html 作为模板。
    location = / {
        proxy_pass http://app:80/seo/www;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # robots.txt / sitemap.xml 由后端动态生成
    location ~ ^/(robots\.txt|sitemap\.xml)$ {
        proxy_pass http://app:80;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 官网公开页面（单段）：SEO 落地页 / 关于 / 条款 / 隐私 / 产品列表
    location ~ ^/(cloud-server|hong-kong-server|us-server|high-defense-server|cloud-pc|about|terms|privacy|products)$ {
        proxy_pass http://app:80/seo/www$request_uri;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 公告/帮助列表与详情（/notices、/notices/123、/help、/help/123）
    location ~ ^/(notices|help)(/[0-9]+)?$ {
        proxy_pass http://app:80/seo/www$request_uri;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 产品详情（/products/123；多段购买页路径保持 SPA 静态回退）
    location ~ ^/products/[0-9]+$ {
        proxy_pass http://app:80/seo/www$request_uri;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # History 路由回退（其余路径保持 SPA 行为）
    location / {
        try_files $uri $uri/ /index.html;
    }

    location = /favicon.ico { access_log off; log_not_found off; }
}

# ---------- 用户控制台 ----------
server {
    listen 8082;
    server_name _;

    # 同 8081：禁用绝对重定向，避免尾斜杠规范化时泄露容器内部端口并降级协议
    absolute_redirect off;

    root /usr/share/nginx/html/console;
    index index.html;
    charset utf-8;

    gzip on;
    # 构建产物已随包生成 .gz 预压缩文件（www 下 65 个），镜像 nginx 含
    # http_gzip_static_module，优先直接返回预压缩件，避免每次请求重复压缩。
    # 注：同时生成的 .br 需要 brotli 模块，当前 nginx:alpine 基础镜像不含，故未启用。
    gzip_static on;
    gzip_min_length 1024;
    gzip_types text/css application/javascript application/json image/svg+xml application/xml;
    gzip_vary on;

    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    location = /favicon.ico { access_log off; log_not_found off; }
}

