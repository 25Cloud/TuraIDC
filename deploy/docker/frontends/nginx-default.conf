    location = /favicon.ico { access_log off; log_not_found off; }
}

# ---------- 管理端 ----------
server {
    listen 8083;
    server_name _;

    root /usr/share/nginx/html/admin;
    index index.html;
    charset utf-8;

    gzip on;
    gzip_min_length 1024;
    gzip_types text/css application/javascript application/json image/svg+xml application/xml;
    gzip_vary on;

