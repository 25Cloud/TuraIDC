# TuraIDC 前端三端合一 Nginx 配置（容器内三端口）
# 8081 → 官网/用户入口  8082 → 用户控制台  8083 → 管理端
# Vue Router History 模式回退 + 静态资源长缓存

# ---------- 官网/用户入口 ----------
server {
    listen 8081;
    server_name _;

    # 预渲染在 webroot 下生成 products/ notices/ about/ 等真实目录，try_files 的
    # $uri/ 命中目录后 nginx 会 301 规范化尾斜杠。默认 absolute_redirect on 会用
    # 「监听端口 + http」拼出绝对地址（如 http://host:8081/products/）：反代部署下
    # 把容器内部端口泄露给浏览器并把 https 降级为 http；按文档做端口收口
    # （仅监听 127.0.0.1）后更会直接 503，所有预渲染深链对外不可达。
    absolute_redirect off;

    root /usr/share/nginx/html/www;
    index index.html;
    charset utf-8;

    gzip on;
    # 构建产物已随包生成 .gz 预压缩文件（www 下 65 个），镜像 nginx 含
    # http_gzip_static_module，优先直接返回预压缩件，避免每次请求重复压缩。
    # 注：同时生成的 .br 需要 brotli 模块，当前 nginx:alpine 基础镜像不含，故未启用。
    gzip_static on;
    gzip_min_length 1024;
    gzip_types text/css application/javascript application/json image/svg+xml application/xml;
    gzip_vary on;

    # 带 hash 的构建产物：长缓存
    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # History 路由回退
    location / {
        try_files $uri $uri/ /index.html;
    }

    location = /favicon.ico { access_log off; log_not_found off; }
}

# ---------- 用户控制台 ----------
server {
    listen 8082;
    server_name _;

    # 同 8081：禁用绝对重定向，避免尾斜杠规范化时泄露容器内部端口并降级协议
    absolute_redirect off;

    root /usr/share/nginx/html/console;
    index index.html;
    charset utf-8;

    gzip on;
    # 构建产物已随包生成 .gz 预压缩文件（www 下 65 个），镜像 nginx 含
    # http_gzip_static_module，优先直接返回预压缩件，避免每次请求重复压缩。
    # 注：同时生成的 .br 需要 brotli 模块，当前 nginx:alpine 基础镜像不含，故未启用。
    gzip_static on;
    gzip_min_length 1024;
    gzip_types text/css application/javascript application/json image/svg+xml application/xml;
    gzip_vary on;

    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    location = /favicon.ico { access_log off; log_not_found off; }
}

# ---------- 管理端 ----------
server {
    listen 8083;
    server_name _;

    # 同 8081：禁用绝对重定向，避免尾斜杠规范化时泄露容器内部端口并降级协议
    absolute_redirect off;

    root /usr/share/nginx/html/admin;
    index index.html;
    charset utf-8;

    gzip on;
    # 构建产物已随包生成 .gz 预压缩文件（www 下 65 个），镜像 nginx 含
    # http_gzip_static_module，优先直接返回预压缩件，避免每次请求重复压缩。
    # 注：同时生成的 .br 需要 brotli 模块，当前 nginx:alpine 基础镜像不含，故未启用。
    gzip_static on;
    gzip_min_length 1024;
    gzip_types text/css application/javascript application/json image/svg+xml application/xml;
    gzip_vary on;

    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    location = /favicon.ico { access_log off; log_not_found off; }
}
