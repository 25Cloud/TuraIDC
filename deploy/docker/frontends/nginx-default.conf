# TuraIDC 前端三端合一 Nginx 配置（容器内三端口）
# 8081 → 官网/用户入口  8082 → 用户控制台  8083 → 管理端
# Vue Router History 模式回退 + 静态资源长缓存

# ---------- 官网/用户入口 ----------
server {
    listen 8081;
    server_name _;

    root /usr/share/nginx/html/www;
    index index.html;
    charset utf-8;

    gzip on;
    gzip_min_length 1024;
    gzip_types text/css application/javascript application/json image/svg+xml application/xml;
    gzip_vary on;

    # 带 hash 的构建产物：长缓存
    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # History 路由回退
    location / {
        try_files $uri $uri/ /index.html;
    }

    location = /favicon.ico { access_log off; log_not_found off; }
}

# ---------- 用户控制台 ----------
server {
    listen 8082;
    server_name _;

    root /usr/share/nginx/html/console;
    index index.html;
    charset utf-8;

    gzip on;
    gzip_min_length 1024;
    gzip_types text/css application/javascript application/json image/svg+xml application/xml;
