# TuraIDC 三端前端 CSP 响应头（可复制片段）
#
# 关系：三端 index.html 里的 <meta http-equiv="Content-Security-Policy"> 只是「没有响应头时的兜底」，
# 静态 HTML 无法随环境变化，也不能声明 frame-ancestors / report-uri / sandbox。真正生效的策略是
# 这里的响应头：它更严、改了不用重新构建，也能收紧到具体的 API 源站。两者必须同源同步——收紧响应头
# 时 meta 可以继续放宽（兜底≠授权），但**不要**在 meta 里放开响应头没有的来源，否则一旦响应头缺失，
# 兜底形同虚设。
#
# 用法（nginx）：把对应 server 的三行粘进 server{} 顶层；nginx 的 add_header 不继承——只要某个
# location 里已经写了 add_header（例如 Cache-Control），就必须在该 location 内再粘一遍这三行，
# 否则 index.html 会丢掉 CSP。示例：
#
#   server {
#       listen 8082;
#       root /usr/share/nginx/html/console;
#       include snippets/frontend-csp-console.conf;   # 或直接贴下面三行
#
#       location /assets/ {
#           expires 30d;
#           add_header Cache-Control "public, immutable";
#           include snippets/frontend-csp-console.conf;  # 本 location 自己写了 add_header，要重贴
#       }
#   }
#
# 也可以抽成独立文件后在每个 server/location 里 include（推荐，避免三处策略漂移）。
# 值的来源与理由见下方注释；改动请在 docs/guide/deploy/generic.md「CSP 与点击劫持」一节同步。

# ---------- 官网 / 用户入口（frontend-user-v3-www） ----------
# script-src 含 'unsafe-inline'：index.html 内联的首页 LCP 预热脚本与站点品牌首帧注入脚本；
#   含 'unsafe-eval'：vue-i18n 运行时编译语言包（未接 @intlify 预编译）。
# style-src 含 'unsafe-inline'：Element Plus 运行时注入样式 + 首屏 splash 内联样式。
# 本端无需第三方脚本域名：Element Plus 与业务代码都打进 /assets。
# img-src/media-src/connect-src 的 https: 兜底 API 源站与站点媒体绝对地址（VITE_API_BASE_URL 决定）。
# frame-ancestors 'self'：只允许同源页面嵌入（meta 无法声明该指令）。
add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https:; font-src 'self' data:; connect-src 'self' https:; media-src 'self' https: blob:; frame-src 'self' https:; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'self'" always;
add_header X-Frame-Options "SAMEORIGIN" always;
add_header X-Content-Type-Options "nosniff" always;

# ---------- 用户控制台（frontend-user-v4-console） ----------
# script-src 极验六域名：src/composables/useGeeTestCaptcha.ts 默认加载 static.geetest.com/v4/gt4.js，
#   gt4.js 运行期还会加载 gcaptcha4.* / static.* 的验证库并向 monitor.geetest.com 埋点；
#   客户端已固定 https，故只列 https 版本。
# script-src https://res.25y.cn：人机验证适配脚本（Corptcha）内部 SDK。
# script-src https://tdesign.gtimg.com：t-icon 默认 loadDefaultIcons 的 SVG 雪碧图。
# script-src 'unsafe-inline'：index.html 的品牌首帧注入与 Aegis 引导脚本；'unsafe-eval'：vue-i18n 运行时编译。
# style-src 极验域名：gt4.js 动态插入 gcaptcha4.css；'unsafe-inline'：TDesign 运行时注入样式。
# frame-src alipays:：充值页用隐藏 iframe 拉起支付宝 App。
# frame-src https:：服务面板 iframe 由后端代理到 API 源站（生产必为 https）。
add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval' https://static.geetest.com https://static.geevisit.com https://gcaptcha4.geetest.com https://gcaptcha4.geevisit.com https://gcaptcha4.gsensebot.com https://monitor.geetest.com https://res.25y.cn https://tdesign.gtimg.com; style-src 'self' 'unsafe-inline' https://static.geetest.com https://static.geevisit.com; img-src 'self' data: blob: https:; font-src 'self' data:; connect-src 'self' https:; media-src 'self' https: blob:; frame-src 'self' https: alipays:; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'self'" always;
add_header X-Frame-Options "SAMEORIGIN" always;
add_header X-Content-Type-Options "nosniff" always;

# ---------- 管理端（frontend-admin-v3） ----------
# 与管理端 index.html 的 meta 同源：极验（登录页验证码）、res.25y.cn（适配脚本内部 SDK）、
# tdesign.gtimg.com（t-icon 雪碧图）、'unsafe-inline'（index.html 的 window.global 引导）、
# 'unsafe-eval'（vue-i18n 运行时编译）、font-src data:（TencentSansW7 base64）。
# frame-src https:：服务面板 iframe 走后端代理的 API 源站。
add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval' https://static.geetest.com https://static.geevisit.com https://gcaptcha4.geetest.com https://gcaptcha4.geevisit.com https://gcaptcha4.gsensebot.com https://monitor.geetest.com https://res.25y.cn https://tdesign.gtimg.com; style-src 'self' 'unsafe-inline' https://static.geetest.com https://static.geevisit.com; img-src 'self' data: blob: https:; font-src 'self' data:; connect-src 'self' https:; media-src 'self' https: blob:; frame-src 'self' https:; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'self'" always;
add_header X-Frame-Options "SAMEORIGIN" always;
add_header X-Content-Type-Options "nosniff" always;
